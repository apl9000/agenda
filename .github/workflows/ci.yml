name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Verify embedded Info.plist
        run: |
          set -euo pipefail
          python3 Scripts/verify_embedded_info_plist.py --self-test
          BINARY=".build/release/agenda"
          otool -s __TEXT __info_plist "$BINARY" | tee "$RUNNER_TEMP/agenda-info-plist.otool"
          python3 Scripts/verify_embedded_info_plist.py \
            --binary "$BINARY" \
            --otool-output "$RUNNER_TEMP/agenda-info-plist.otool"

      - name: Run tests
        run: swift test
